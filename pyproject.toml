[project]
name = "traffic"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.8", "numpy>=1.26"]

[project.scripts]
traffic = "traffic:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.{h,c,hpp,cpp}" },
    { file = "src/traffic/**/*.py" },
    { file = "include/**/*.hpp" },
    { file = "CMakeLists.txt" },
]

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"
